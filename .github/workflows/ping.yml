name: Schedule ping

# Диагностический workflow: проверяет, работает ли расписание GitHub
# для этого репозитория вообще. Удалить после диагностики.
on:
  schedule:
    - cron: "5-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: echo "pong at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
